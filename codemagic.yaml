workflows:
  android-release:
    name: Android Release Build
    max_build_duration: 60
    environment:
      java: 17
      vars:
        KEYSTORE_PATH: /tmp/release.keystore
        KEY_ALIAS: IPC
      groups:
        - keystore_credentials
    scripts:
      - name: Set up keystore
        script: |
          echo $KEYSTORE_BASE64 | base64 --decode > /tmp/release.keystore
      - name: Download Gradle Wrapper
        script: |
          mkdir -p gradle/wrapper
          curl -L https://github.com/gradle/gradle/raw/v8.10.2/gradle/wrapper/gradle-wrapper.jar \
            -o gradle/wrapper/gradle-wrapper.jar
      - name: Generate launcher icons
        script: |
          pip install Pillow
          python3 << 'EOF'
          from PIL import Image
          import os

          src = "app/ic_launcher.png"
          img = Image.open(src).convert("RGBA")

          sizes = {
            "mipmap-mdpi": 48,
            "mipmap-hdpi": 72,
            "mipmap-xhdpi": 96,
            "mipmap-xxhdpi": 144,
            "mipmap-xxxhdpi": 192,
          }

          for folder, size in sizes.items():
            out_dir = f"app/src/main/res/{folder}"
            os.makedirs(out_dir, exist_ok=True)
            resized = img.resize((size, size), Image.LANCZOS)
            resized.save(f"{out_dir}/ic_launcher.png")
            resized.save(f"{out_dir}/ic_launcher_round.png")
            print(f"Generated {size}x{size} in {out_dir}")

          EOF
      - name: Set executable permission
        script: chmod +x gradlew
      - name: Build release APK
        script: |
          ./gradlew assembleRelease \
            -PKEYSTORE_PATH=/tmp/release.keystore \
            -PKEYSTORE_PASSWORD=$KEYSTORE_PASSWORD \
            -PKEY_ALIAS=$KEY_ALIAS \
            -PKEY_PASSWORD=$KEY_PASSWORD
      - name: Build release AAB (Play Store)
        script: |
          ./gradlew bundleRelease \
            -PKEYSTORE_PATH=/tmp/release.keystore \
            -PKEYSTORE_PASSWORD=$KEYSTORE_PASSWORD \
            -PKEY_ALIAS=$KEY_ALIAS \
            -PKEY_PASSWORD=$KEY_PASSWORD
    artifacts:
      - app/build/outputs/apk/release/*.apk
      - app/build/outputs/bundle/release/*.aab
      - app/build/outputs/mapping/release/mapping.txt
    publishing:
      email:
        recipients:
          - alfredopjonas@gmail.com
        notify:
          success: true
          failure: true

  android-debug:
    name: Android Debug Build
    max_build_duration: 30
    environment:
      java: 17
    scripts:
      - name: Download Gradle Wrapper
        script: |
          mkdir -p gradle/wrapper
          curl -L https://github.com/gradle/gradle/raw/v8.10.2/gradle/wrapper/gradle-wrapper.jar \
            -o gradle/wrapper/gradle-wrapper.jar
      - name: Generate launcher icons
        script: |
          pip install Pillow
          python3 << 'EOF'
          from PIL import Image
          import os

          src = "app/ic_launcher.png"
          img = Image.open(src).convert("RGBA")

          sizes = {
            "mipmap-mdpi": 48,
            "mipmap-hdpi": 72,
            "mipmap-xhdpi": 96,
            "mipmap-xxhdpi": 144,
            "mipmap-xxxhdpi": 192,
          }

          for folder, size in sizes.items():
            out_dir = f"app/src/main/res/{folder}"
            os.makedirs(out_dir, exist_ok=True)
            resized = img.resize((size, size), Image.LANCZOS)
            resized.save(f"{out_dir}/ic_launcher.png")
            resized.save(f"{out_dir}/ic_launcher_round.png")
            print(f"Generated {size}x{size} in {out_dir}")

          EOF
      - name: Set executable permission
        script: chmod +x gradlew
      - name: Build debug APK
        script: ./gradlew assembleDebug
    artifacts:
      - app/build/outputs/apk/debug/*.apk
    publishing:
      email:
        recipients:
          - alfredopjonas@gmail.com
        notify:
          success: false
          failure: true