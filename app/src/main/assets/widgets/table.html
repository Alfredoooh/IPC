<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Table Widget</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 12px;
      background: var(--bg, #ffffff);
      font-family: Arial, sans-serif;
      color: var(--text, #111);
    }
    .table-wrapper {
      width: 100%;
      overflow: hidden;
      border-radius: 14px;
      border: 1px solid var(--border, #d4d8dd);
      box-shadow: 0 6px 18px rgba(0,0,0,0.07);
      background: var(--surface, #fff);
    }
    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
    }
    thead th {
      background: var(--header-bg, #f5f7fa);
      color: var(--text, #111);
      font-weight: 700;
      padding: 12px 14px;
      text-align: left;
      border-bottom: 1px solid var(--divider, #d4d8dd);
      font-size: 13px;
    }
    thead th:not(:last-child) {
      border-right: 1px solid var(--divider, #e3e7ec);
    }
    tbody td {
      padding: 11px 14px;
      border-bottom: 1px solid var(--divider, #edf1f5);
      background: var(--surface, #fff);
      font-size: 13px;
      color: var(--text-secondary, #555);
    }
    tbody td:not(:last-child) {
      border-right: 1px solid var(--divider, #edf1f5);
    }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover td { background: var(--row-hover, #fafbfc); }
    thead th:first-child { border-top-left-radius: 14px; }
    thead th:last-child  { border-top-right-radius: 14px; }
    tbody tr:last-child td:first-child { border-bottom-left-radius: 14px; }
    tbody tr:last-child td:last-child  { border-bottom-right-radius: 14px; }
  </style>
</head>
<body>
  <!-- tableData injetado pelo app:
       window.tableData = { headers: ["Col1","Col2"], rows: [["A","B"],["C","D"]] }
  -->
  <div class="table-wrapper">
    <table id="tbl">
      <thead><tr id="thead-row"></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
  <script>
    const data = window.tableData || {
      headers: ["Nome", "Valor"],
      rows: [["Exemplo", "—"]]
    };

    const theadRow = document.getElementById("thead-row");
    data.headers.forEach(h => {
      const th = document.createElement("th");
      th.textContent = h;
      theadRow.appendChild(th);
    });

    const tbody = document.getElementById("tbody");
    data.rows.forEach(row => {
      const tr = document.createElement("tr");
      row.forEach(cell => {
        const td = document.createElement("td");
        td.textContent = cell;
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
  </script>
</body>
</html>
