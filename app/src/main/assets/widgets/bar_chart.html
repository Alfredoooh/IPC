<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bar Chart Widget</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 12px;
      background: var(--bg, #ffffff);
      font-family: Arial, sans-serif;
      color: var(--text, #111);
    }
    .widget {
      width: 100%;
      background: var(--surface, #fff);
      border: 1px solid var(--border, #d9dde3);
      border-radius: 14px;
      overflow: hidden;
    }
    .widget-header {
      padding: 14px 16px;
      border-bottom: 1px solid var(--divider, #e7ebf0);
      background: var(--header-bg, #f7f9fb);
    }
    .widget-title {
      margin: 0;
      font-size: 15px;
      font-weight: 700;
      color: var(--text, #111);
    }
    .widget-body { padding: 14px 16px 16px; }
    .chart {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      height: 200px;
      padding: 10px;
      border: 1px solid var(--divider, #e7ebf0);
      border-radius: 10px;
      background: var(--surface, #fff);
    }
    .item {
      flex: 1;
      min-width: 0;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
    }
    .value {
      font-size: 11px;
      font-weight: 700;
      margin-bottom: 6px;
      color: var(--text, #222);
    }
    .bar-wrap {
      width: 100%;
      height: 150px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }
    .bar {
      width: 100%;
      max-width: 40px;
      height: var(--h);
      background: var(--bar-color, #6F5AF6);
      border-radius: 7px 7px 0 0;
      transform-origin: bottom;
      animation: grow 800ms ease-out forwards;
      transform: scaleY(0);
      box-shadow: 0 4px 12px rgba(111,90,246,0.20);
    }
    .label {
      margin-top: 8px;
      font-size: 11px;
      color: var(--text-secondary, #555);
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }
    @keyframes grow { to { transform: scaleY(1); } }
  </style>
</head>
<body>
  <!-- barData injetado pelo app:
       window.barData = { title: "Título", items: [{label:"Jan", value:35, color:"#e74c3c"}, ...] }
  -->
  <div class="widget">
    <div class="widget-header">
      <h1 class="widget-title" id="chart-title">Gráfico</h1>
    </div>
    <div class="widget-body">
      <div class="chart" id="chart"></div>
    </div>
  </div>
  <script>
    const data = window.barData || {
      title: "Dados",
      items: [
        { label: "A", value: 60 },
        { label: "B", value: 80 },
        { label: "C", value: 40 }
      ]
    };

    document.getElementById("chart-title").textContent = data.title || "Gráfico";

    const max = Math.max(...data.items.map(d => d.value));
    const chart = document.getElementById("chart");

    data.items.forEach((item, i) => {
      const pct = max > 0 ? (item.value / max) * 100 : 0;
      const color = item.color || getComputedStyle(document.documentElement).getPropertyValue("--bar-color").trim() || "#6F5AF6";

      const div = document.createElement("div");
      div.className = "item";
      div.innerHTML = `
        <div class="value">${item.value}${item.unit || ""}</div>
        <div class="bar-wrap">
          <div class="bar" style="--h:${pct}%;background:${color};animation-delay:${i * 80}ms"></div>
        </div>
        <div class="label">${item.label}</div>
      `;
      chart.appendChild(div);
    });
  </script>
</body>
</html>
